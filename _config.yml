remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "air"

locale: "en-US"
title: "Nhi Nguyen"
title_separator: "|"
subtitle: "Data Mining, Dashboards & Writings"
name: "Nhi Nguyen"
description: "Data mining, visualization, and ML projects & short analyses of data in the news."
url: "https://ynhi-ng.github.io"
baseurl: "/nhinguyen-ds-portfolio"
repository: "ynhi-ng/nhinguyen-ds-portfolio"
search: true
search_full_content: true
breadcrumbs: true

author:
  name: "Data mining · machine learning · storytelling"
  bio: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ynhi-ng"
    - label: "Projects repo"
      icon: "fas fa-fw fa-code"
      url: "https://github.com/ynhi-ng/data-mining-projects"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ynhi-ng"
    - label: "Portfolio source"
      icon: "fas fa-fw fa-code-branch"
      url: "https://github.com/ynhi-ng/nhinguyen-ds-portfolio"

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - .sass-cache
  - node_modules

markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Australia/Melbourne

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

paginate: 5
paginate_path: /posts/page:num/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: false
      related: false
      classes: wide

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
